# The prompt's slots: starship prints these NUMBERS (templates/starship.toml), so a prompt already on screen follows a theme switch.
# Eight of the 240 extended slots, chosen where no default of the installed tools reaches (fzf, delta, lazygit, bat, nvim, eza) and
# nothing in the user's own configs does: the dark purples of xterm's cube. A program that prints one of them gets these colours.
color53 {{starshipRamp0}}
color54 {{starshipRamp1}}
color55 {{starshipRamp2}}
color56 {{starshipRamp3}}
color89 {{starshipHead}}
color90 {{textOnAccent}}
color91 {{starshipOk}}
color92 {{starshipError}}
