# Generated by themectl from theme {{theme}} ({{mode}}). Do not edit: change the theme file, run `themectl apply`.
# THE COLOURS ARE PALETTE SLOTS, NOT HEX: 53-56 the ramp, 89 the head, 90 the text on it, 91 / 92 the prompt character (ok / error).
# kitty's theme file (kitty-current-theme.conf, the same run) gives those slots their colours, and a terminal keeps the SLOT in every
# cell it has printed -- so the prompts already on screen change with the theme, in kitty and in yazi's header alike. A hex colour is
# stored as itself and would keep the old theme until it scrolls away. In a terminal whose slots 16-255 cannot be themed (VS Code's)
# the prompt shows that terminal's own colours for these slots.
format = """
[](53)\
[](fg:54 bg:53)\
[](fg:55 bg:54)\
[](fg:56 bg:55)\
[  ](fg:89 bg:56)\
[   ](fg:90 bg:89)\
[](fg:89 bg:56)\
$directory\
[](fg:56 bg:55)\
[](fg:55 bg:54)\
[](fg:54 bg:53)\
[](53)\
\n$character"""

[directory]
style = "fg:90 bg:56"
format = "[ $path ]($style)"
truncation_length = 14
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰧮"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
".config" = ""

[character]
success_symbol = '[❯](bold 91) '
error_symbol = '[❯](bold 92) '
