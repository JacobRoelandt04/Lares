# The rig's NetworkManager (never the user's): its own keyfiles, no polkit (the bus is private), no DNS writes, the CLIENT radio
# only. Its own connectivity check stays OFF like the user's: the module checks for itself.
[main]
plugins=keyfile
auth-polkit=false
dns=none
rc-manager=unmanaged
dhcp=internal
no-auto-default=*
# never touch a hostname (the rig runs in its own UTS namespace too; this is the second wall)
hostname-mode=none

[keyfile]
path=@RUN@/keyfiles
# the client radio, and the software links a Proton-like tunnel makes (the rig probe's stand-in leaves Proton's real footprint: the dummy
# pvpnksintrf0, the wireguard proton0, the IPv6 leak guard ipv6leakintrf0); everything else (the access points' radios, the veth, the
# bridge) stays unmanaged. A device is unmanaged unless it matches one of these.
unmanaged-devices=except:interface-name:@CLIENT@,except:interface-name:proton0,except:interface-name:pvpnksintrf0,except:interface-name:ipv6leakintrf0

[connectivity]
enabled=false

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

[logging]
level=INFO
