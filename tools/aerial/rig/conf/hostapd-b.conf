# AP B (5 GHz channel 36 when the domain allows it, else 2.4 GHz channel 11): WPA3-SAE, 802.1X (PEAP / TTLS through hostapd's
# own EAP server), and "rig-wpa2" AGAIN (same name, same passphrase as on AP A: one name on two radios, for dual band and roaming).
interface=@IF@
bridge=br-rig
driver=nl80211
ctrl_interface=@RUN@/hostapd
ctrl_interface_group=@GID@
hw_mode=@MODE@
channel=@CHAN@
ieee80211n=1
ieee80211ac=@VHT@
@COUNTRY@
ssid=rig-wpa3
wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
auth_algs=1
ieee80211w=2
sae_password=rig-pass-wpa3

bss=@IF@_1
bridge=br-rig
ssid=rig-eap
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP
auth_algs=1
ieee8021x=1
eap_server=1
eap_user_file=/usr/local/lib/lares/aerial-rig/conf/eap_users
ca_cert=@RUN@/pki/ca.pem
server_cert=@RUN@/pki/server.pem
private_key=@RUN@/pki/server.key

bss=@IF@_2
bridge=br-rig
ssid=rig-wpa2
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1
wpa_passphrase=rig-pass-wpa2
