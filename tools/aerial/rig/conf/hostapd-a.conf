# AP A (2.4 GHz, channel 1): an open network, a WPA2 one and a HIDDEN one, all on the rig's bridge. @...@ filled by `rig inner`.
interface=@IF@
bridge=br-rig
driver=nl80211
ctrl_interface=@RUN@/hostapd
ctrl_interface_group=@GID@
hw_mode=g
channel=1
ieee80211n=1
@COUNTRY@
ssid=rig-open

bss=@IF@_1
bridge=br-rig
ssid=rig-wpa2
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1
wpa_passphrase=rig-pass-wpa2

bss=@IF@_2
bridge=br-rig
ssid=rig-hidden
ignore_broadcast_ssid=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1
wpa_passphrase=rig-pass-hidden
