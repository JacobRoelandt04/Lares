# DHCP + DNS for every rig network (one bridge, one subnet). The connectivity check's host resolves to the portal stand-in.
interface=br-rig
bind-interfaces
except-interface=lo
dhcp-range=10.77.0.50,10.77.0.150,1h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
# (the module's helper is given the portal by ADDRESS, --check-url http://10.77.0.1:8080/nm-check.txt: the host's resolver is not this one)
address=/ping.archlinux.org/10.77.0.1
no-resolv
no-hosts
log-dhcp
