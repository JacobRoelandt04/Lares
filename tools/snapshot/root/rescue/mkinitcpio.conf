# The rescue image's own mkinitcpio config. It is used ONLY by `build` (never by pacman's kernel hooks), so a kernel update never rebuilds it.
# No `autodetect`: the image must start on hardware the running system does not need today (a USB keyboard, another disk controller),
# so `block` and `keyboard` bring ALL their modules. No `filesystems` hook (it would bring every file system); the two we need are named.
MODULES=(ext4 vfat nls_cp437 nls_iso8859_1 nls_utf8)
BINARIES=()
FILES=()
HOOKS=(base udev keymap keyboard block lares_rescue)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
