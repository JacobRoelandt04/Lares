<!doctype html>
<!-- Bauhaus wallpapers: procedural wallpapers for the shell, one composition drawn in the eva theme's light and dark palettes.
     Self-contained: open it from disk. Nothing is fetched and no canvas makes the files: the engine rasterises and encodes the PNG itself.
     tools/wallpapers/check.js judges the engine in node. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bauhaus wallpapers</title>
<style>
:root { color-scheme: light; --r: 14px; --r2: 10px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface); color: var(--textPrimary); font: 12px/1.45 Inter, "Noto Sans", system-ui, sans-serif; }
.app { display: grid; grid-template-columns: 372px minmax(0, 1fr); height: 100vh; gap: 12px; padding: 12px; }
.panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
h1 { font: 700 16px Audiowide, Inter, sans-serif; margin: 2px 2px 0; letter-spacing: .02em; }
.carved { background: var(--listBox); border-radius: var(--r); box-shadow: inset 0 0 3px 0 var(--shadowDeep), 0 0 0 1px var(--bevel); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; flex: none; }
.tabs button { all: unset; text-align: center; padding: 6px 0; border-radius: var(--r2); cursor: pointer; color: var(--textMuted); transition: color .16s, background-color .16s; }
.tabs button:hover { color: var(--textPrimary); }
.tabs button.on { background: var(--accent); color: var(--surface); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.tab { display: none; flex-direction: column; gap: 10px; }
.tab.on { display: flex; }
.group { font-weight: 600; color: var(--textMuted); margin: 8px 0 -4px; text-transform: none; }
.group:first-child { margin-top: 0; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 50px; align-items: center; gap: 8px; min-height: 24px; }
.row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--textMuted); font-size: 11px; }
.row.sel { grid-template-columns: 96px minmax(0, 1fr); }
.star { color: var(--accent); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--headerBox); box-shadow: inset 0 0 2px var(--shadowDeep); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--surface); box-shadow: 0 0 3px var(--shadowDeep), inset 0 0 1px var(--bevel); }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--headerBox); box-shadow: inset 0 0 2px var(--shadowDeep); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 3px var(--shadowDeep); }
select, input[type=text], input[type=number], textarea {
    font: inherit; color: var(--textPrimary); background: var(--panelSunk); border: 0; border-radius: var(--r2); padding: 5px 9px; width: 100%; outline: none;
    box-shadow: inset 0 0 3px 0 var(--shadowDeep), 0 0 0 1px var(--bevel);
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { box-shadow: inset 0 0 3px 0 var(--accent), 0 0 0 1px var(--accent); }
textarea { resize: none; height: 66px; font: 11px/1.4 "JetBrains Mono", Consolas, monospace; word-break: break-all; }
#snippet { height: 92px; white-space: pre; overflow-x: auto; word-break: normal; }
button.btn { all: unset; cursor: pointer; text-align: center; padding: 6px 12px; border-radius: var(--r2); background: var(--surface); color: var(--textPrimary);
    box-shadow: 0 0 5px var(--shadowDeep), inset 0 0 1.5px var(--buttonBevel); transition: background-color .16s; }
button.btn:hover { background: var(--bevel); }
button.btn.lead { background: var(--accent); color: var(--surface); }
button.btn:disabled { color: var(--textFaint); cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; }
.gens { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.gen { all: unset; cursor: pointer; border-radius: var(--r2); overflow: hidden; background: var(--panelSunk); display: flex; flex-direction: column; box-shadow: inset 0 0 3px 0 var(--shadowDeep), 0 0 0 1px var(--bevel); }
.gen canvas { width: 100%; aspect-ratio: 16 / 9; display: block; }
.gen span { padding: 4px 8px 5px; color: var(--textMuted); }
.gen.on { box-shadow: 0 0 0 2px var(--accent); }
.gen.on span { color: var(--textPrimary); }
.blurb { color: var(--textMuted); margin: 0; }
.seed { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px auto; gap: 6px; align-items: center; }
.seed .btn { padding: 5px 0; }
.seed .wide { padding: 5px 12px; }
.pal { display: grid; grid-template-columns: minmax(0, 1fr) 96px 96px; gap: 6px 8px; align-items: center; }
.hex { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px; align-items: center; }
.hex input[type=text] { padding: 4px 5px; font-size: 11px; }
.hex input[type=color] { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: none; cursor: pointer; }
.hex input[type=color]::-moz-color-swatch { border: 0; border-radius: 6px; box-shadow: 0 0 0 1px var(--border); }
.hex input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.hex input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
.note { color: var(--textMuted); margin: 0; }
.stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.tools { display: flex; gap: 8px; align-items: center; flex: none; flex-wrap: wrap; min-height: 36px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; }
.seg button { all: unset; padding: 4px 12px; border-radius: 8px; cursor: pointer; color: var(--textMuted); transition: color .16s; }
.seg button:hover { color: var(--textPrimary); }
.seg button.on { background: var(--accent); color: var(--surface); }
.status { margin-left: auto; color: var(--textMuted); font-variant-numeric: tabular-nums; }
.view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: hidden; }
.view.full { align-items: flex-start; justify-content: flex-start; overflow: auto; }
.frame { position: relative; line-height: 0; box-shadow: 0 0 0 1px var(--bevel); }
.frame canvas { display: block; }
.frame canvas + canvas { position: absolute; inset: 0; pointer-events: none; }
.frame.split { cursor: ew-resize; }
#tip { position: fixed; z-index: 10; max-width: 300px; padding: 8px 11px; border-radius: var(--r2); background: var(--surface); color: var(--textPrimary); pointer-events: none;
    box-shadow: 0 0 8px var(--shadowDeep), inset 0 0 1.5px var(--buttonBevel); opacity: 0; transition: opacity .16s; line-height: 1.4; }
#tip.on { opacity: 1; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } .scroll { max-height: 60vh; } .view { min-height: 260px; } }
</style>
</head>
<body>
<main class="app">
    <aside class="panel">
        <h1>Bauhaus wallpapers</h1>
        <nav class="tabs carved" id="tabs">
            <button data-tab="wall" class="on" data-tip="Generator, seed and what shapes it.">Wallpaper</button>
            <button data-tab="pal" data-tip="The role of every ink in light and in dark. Defaults: the eva theme.">Palette</button>
            <button data-tab="out" data-tip="Resolution, download, and the settings that reproduce this picture.">Export</button>
        </nav>
        <div class="scroll carved">
            <section class="tab on" id="tab-wall">
                <div class="gens" id="gens"></div>
                <p class="blurb" id="blurb"></p>
                <div class="group">Seed</div>
                <div class="seed" data-tip="One seed is one composition, at every resolution, in both modes.">
                    <button class="btn" id="seedPrev" aria-label="Previous seed">&lt;</button>
                    <input type="number" id="seed" min="1" max="999999" step="1">
                    <button class="btn" id="seedNext" aria-label="Next seed">&gt;</button>
                    <button class="btn lead wide" id="shuffle">Shuffle</button>
                </div>
                <div id="params" class="tab on"></div>
                <div class="btns"><button class="btn" id="resetWall" data-tip="Every parameter of this generator back to its default. Seed and palette stay.">Reset</button></div>
            </section>
            <section class="tab" id="tab-pal">
                <p class="note">One picture, two palettes. Light and dark share every edge; only these colours differ. Every default is a token of themes/eva.json.</p>
                <div class="pal" id="pal"></div>
                <div class="btns"><button class="btn" id="resetPal" data-tip="Every role back to its eva token.">Reset</button></div>
            </section>
            <section class="tab" id="tab-out">
                <div class="group">Resolution</div>
                <div class="row sel" data-tip="The output size. 2880 x 1620 is this panel. The picture follows the aspect ratio, so every 16:9 size is the same picture.">
                    <label for="res">Size</label>
                    <select id="res"></select>
                </div>
                <div class="row sel" data-tip="Any size. A size of another aspect ratio re-lays the composition on that frame.">
                    <label>Custom</label>
                    <div class="btns" style="flex-wrap:nowrap"><input type="number" id="resW" min="16" max="15360" step="1"><input type="number" id="resH" min="16" max="8640" step="1"></div>
                </div>
                <div class="group">Download</div>
                <div class="btns">
                    <button class="btn" id="dlLight" data-tip="The light picture as PNG at full size.">Light</button>
                    <button class="btn" id="dlDark" data-tip="The dark picture as PNG at full size.">Dark</button>
                    <button class="btn lead" id="dlBoth" data-tip="Both pictures. Same geometry, pixel for pixel: a theme switch only changes the colours.">Both</button>
                </div>
                <div class="group">Files</div>
                <p class="note">Move them to ~/Pictures/wallpapers/, then in shell.jsonc inside "theme":</p>
                <textarea id="snippet" readonly data-tip="The block for shell.jsonc: themectl hands these two files to hyprpaper, one per mode."></textarea>
                <div class="group">Settings</div>
                <textarea id="settings" spellcheck="false" data-tip="Everything that makes this picture. The page's address holds the same text, so a link reproduces it too."></textarea>
                <div class="btns">
                    <button class="btn" id="copySettings" data-tip="Copy the settings.">Copy</button>
                    <button class="btn" id="applySettings" data-tip="Apply the settings in the field above.">Apply</button>
                </div>
            </section>
        </div>
    </aside>
    <section class="stage">
        <div class="tools">
            <div class="seg carved" id="modes">
                <button data-mode="light" data-tip="The light picture; the page follows.">Light</button>
                <button data-mode="dark" data-tip="The dark picture; the page follows.">Dark</button>
                <button data-mode="split" data-tip="Light on the left, dark on the right. Drag across the picture to move the seam: the two line up exactly.">Split</button>
            </div>
            <div class="seg carved" id="overlays">
                <button data-over="shell" data-tip="A mock of the shell over the picture, sized as on the 2880 x 1620 panel at scale 1.25: three islands, slim bars, halo.">Shell</button>
                <button data-over="popup" data-tip="A popup out of the centre island, on top of the shell mock.">Popup</button>
                <button data-over="full" data-tip="The picture at its full size, pixel for pixel, in a scroll box. Slower: every change renders the whole frame.">1:1</button>
            </div>
            <span class="status" id="status"></span>
        </div>
        <div class="view carved" id="view">
            <div class="frame" id="frame"><canvas id="canvas"></canvas><canvas id="overlay"></canvas></div>
        </div>
    </section>
</main>
<div id="tip" role="tooltip"></div>
<script id="wp-core">
"use strict";
// =============================================================================
// The drawing engine. Pure: no DOM, no canvas, no randomness but the seeded generator below. The same code runs in this page and in node
// (a checker lifts this block out of the file), so a picture is defined by this text, not by a browser's canvas.
//
//   Geometry is in FRAME UNITS: the frame is `A = W / H` wide and 1 high, y down. A generator never sees a pixel except as the
//   flattening tolerance, so one seed + one set of parameters is one picture at every resolution of one aspect ratio.
//   A generator records OPS (a path, an ink ROLE, options); it never sees a colour. render() resolves the roles against a
//   palette, so the light and the dark picture come from one and the same coverage: they cannot disagree about an edge.
//   Coverage is exact signed area per pixel (the accumulation rasteriser of font-rs); colours composite in 8-bit sRGB
//   values kept as floats, and a flat fill stays the exact token: a ground pixel IS #DCDFE6.
// =============================================================================
const WP = (() => {
    const TAU = Math.PI * 2;
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

    function hashStr(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
    }
    function rngFor(seed, salt) {
        let a = (Math.imul(seed | 0, 2654435761) ^ hashStr(salt)) | 0;
        const next = () => {
            a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
        for (let i = 0; i < 4; i++) next();
        const r = {
            f: next,
            range: (lo, hi) => lo + (hi - lo) * next(),
            int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
            pick: (list) => list[Math.floor(next() * list.length)],
            chance: (p) => next() < p,
            shuffle: (list) => {
                const l = list.slice();
                for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
                return l;
            },
            weighted: (pairs) => {
                let t = 0; for (const [, w] of pairs) t += w;
                let v = next() * t;
                for (const [x, w] of pairs) { v -= w; if (v <= 0) return x; }
                return pairs[pairs.length - 1][0];
            }
        };
        return r;
    }

    // ---- the eva theme: themes/eva.json, both halves, the tokens a wallpaper uses ---------------------------------------------
    const NIGHT_DEFAULT = 0.1;
    const EVA = {
        light: {
            surface: "#EAEDF5", panelSunk: "#E1E4EB", listBox: "#E5E8EF", headerBox: "#DCDFE6", bevel: "#EDF0F7", border: "#CED1D7",
            shadowDeep: "#AAADB4", textPrimary: "#5D5D5F", textMuted: "#68686B", textFaint: "#888888", accent: "#4480F4",
            ok: "#44C145", warn: "#FF6D12", spill: "#D69A00", error: "#EC0000", errorStrong: "#F14C4C", catMultilib: "#00BEC4",
            catFlatpak: "#C838C6", ballShadow: "#2A2C31", siliconEvaGhost: "#3B4150", buttonBevel: "#FFFFFF"
        },
        dark: {
            surface: "#2C3037", panelSunk: "#21252B", listBox: "#282C34", headerBox: "#23272F", bevel: "#2F323C", border: "#181A1F",
            shadowDeep: "#0B0C0E", textPrimary: "#B0B7C3", textMuted: "#9DA5B3", textFaint: "#676E95", accent: "#598DEF",
            ok: "#4EC150", warn: "#FF8A4C", spill: "#E0AC2E", error: "#F14C4C", errorStrong: "#E51400", catMultilib: "#56B7C3",
            catFlatpak: "#CF68E1", ballShadow: "#000000", siliconEvaGhost: "#232833", buttonBevel: "#3B3F49"
        }
    };

    // A ROLE is what a generator paints with. Each names the eva token of each half.
    const ROLES = [
        { id: "ground", label: "Ground", light: "headerBox", dark: "panelSunk", tip: "The flat ground, 60-80 % of the picture. One step SUNK below the shell's surface so the bars stand on it: a ground equal to the surface loses the 6 px slim bars." },
        { id: "plate", label: "Plate", light: "surface", dark: "surface", tip: "The shell's own surface: the white of an eye, a pale tile. Reads as a piece of the bar in both modes." },
        { id: "mass", label: "Mass", light: "siliconEvaGhost", dark: "shadowDeep", tip: "The pack's near-black anchor, softened to the shell's own blue-grey in light. Darker than the ground in BOTH modes, so a mass never turns into a bright slab at night." },
        { id: "line", label: "Line", light: "textPrimary", dark: "textMuted", tip: "Hairlines and thin strokes: the shell's text ink in each mode." },
        { id: "orange", label: "Orange", light: "warn", dark: "warn", tip: "The pack's lead colour; the shell's warn / catCore." },
        { id: "yellow", label: "Mustard", light: "spill", dark: "spill", tip: "The pack's second warm; the shell's spill." },
        { id: "red", label: "Red", light: "errorStrong", dark: "error", tip: "The pack's red; the softer of the shell's two reds in each mode (#F14C4C in both)." },
        { id: "blue", label: "Blue", light: "accent", dark: "accent", tip: "The pack's one cold colour; the shell's accent." },
        { id: "cyan", label: "Cyan", light: "catMultilib", dark: "catMultilib", tip: "The shell's multilib cyan." },
        { id: "green", label: "Green", light: "ok", dark: "ok", tip: "The shell's ok green." },
        { id: "bevel", label: "Bevel", light: "bevel", dark: "bevel", tip: "Carved edges only: the light rim outside a carved shape (ShadowBox bevelColor)." },
        { id: "shade", label: "Shade", light: "ballShadow", dark: "ballShadow", tip: "Carved edges only: the inset shadow inside a carved shape (the shell's own shadow colour)." }
    ];
    function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    // `night`: how far the bright inks sink toward the ground in the dark picture only. The dark shell is quiet; a full-strength disc is not.
    const BRIGHT = ["orange", "yellow", "red", "blue", "cyan", "green"];
    function palette(mode, overrides, night) {
        const out = {};
        for (const r of ROLES) {
            const o = overrides && overrides[mode] && overrides[mode][r.id];
            out[r.id] = hexRgb(o || EVA[mode][r[mode]]);
        }
        const t = mode === "dark" ? (night === undefined ? NIGHT_DEFAULT : night) : 0;
        if (t > 0) for (const id of BRIGHT) out[id] = out[id].map((v, i) => lerp(v, out.ground[i], t));
        return out;
    }
    function defaultHex(mode, role) { const r = ROLES.find(x => x.id === role); return EVA[mode][r[mode]]; }

    // A COLOURWAY is the order of the inks: first the lead (12-35 % of the picture), then two minor ones.
    const COLOURWAYS = {
        signal: { label: "Signal", inks: ["orange", "yellow", "red"], tip: "The pack's own family: orange lead, mustard and red behind it." },
        triad: { label: "Triad", inks: ["red", "blue", "yellow"], tip: "The Bauhaus primaries in eva's red, accent and spill." },
        accent: { label: "Accent", inks: ["blue", "cyan", "yellow"], tip: "The shell's accent leads, cyan behind it, a touch of mustard." },
        dusk: { label: "Dusk", inks: ["orange", "blue", "cyan"], tip: "The warm lead against the cold accent: the pack's orange on navy." },
        moss: { label: "Moss", inks: ["green", "yellow", "cyan"], tip: "The green arches of the pack (#12, #23) in eva's ok." }
    };

    // ---- geometry: loops are flat arrays x0,y0,x1,y1,... in frame units ---------------------------------------------------------
    class Scene {
        constructor(A, H, mirror) { this.A = A; this.H = H; this.tol = 0.1 / H; this.mirror = !!mirror; this.ops = []; this.inks = COLOURWAYS.signal.inks; this.edge = null; }
        // A straight edge on a pixel boundary: two shapes that meet there share it, and no ground shows through the seam.
        snap(v) { return Math.round(v * this.H) / this.H; }
        // ---- paths
        steps(r, da) {
            const c = Math.max(1e-9, 1 - this.tol / Math.max(r, this.tol * 2));
            return Math.max(2, Math.ceil(Math.abs(da) / (2 * Math.acos(c))));
        }
        arc(out, cx, cy, r, a0, a1) {
            const n = this.steps(r, a1 - a0);
            for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
            return out;
        }
        circle(cx, cy, r, hole) { const o = this.arc([], cx, cy, r, 0, hole ? -TAU : TAU); o.length -= 2; return o; }
        ring(cx, cy, ro, ri) { return [this.circle(cx, cy, ro), this.circle(cx, cy, ri, true)]; }
        rect(x, y, w, h, hole) { return hole ? [x, y, x, y + h, x + w, y + h, x + w, y] : [x, y, x + w, y, x + w, y + h, x, y + h]; }
        // A box with its own radius per corner: tl, tr, br, bl
        rrect(x, y, w, h, rad) {
            const o = [], [tl, tr, br, bl] = rad;
            if (tl > 0) this.arc(o, x + tl, y + tl, tl, Math.PI, Math.PI * 1.5); else o.push(x, y);
            if (tr > 0) this.arc(o, x + w - tr, y + tr, tr, -Math.PI / 2, 0); else o.push(x + w, y);
            if (br > 0) this.arc(o, x + w - br, y + h - br, br, 0, Math.PI / 2); else o.push(x + w, y + h);
            if (bl > 0) this.arc(o, x + bl, y + h - bl, bl, Math.PI / 2, Math.PI); else o.push(x, y + h);
            return o;
        }
        // A disc's slice, closed through its centre: `dir` is the angle the slice faces
        sector(cx, cy, r, a0, a1) { const o = [cx, cy]; this.arc(o, cx, cy, r, a0, a1); return o; }
        half(cx, cy, r, dir) { return this.arc([], cx, cy, r, dir - Math.PI / 2, dir + Math.PI / 2); }
        annularSector(cx, cy, ro, ri, a0, a1) { const o = this.arc([], cx, cy, ro, a0, a1); return this.arc(o, cx, cy, ri, a1, a0); }
        // An arch: a half disc on a pair of legs running down to `base`
        arch(cx, top, r, base) {
            const o = [cx - r, base];
            this.arc(o, cx, top + r, r, Math.PI, TAU);
            o.push(cx + r, base);
            return o;
        }
        reverse(l) { const o = new Array(l.length); for (let i = 0; i < l.length; i += 2) { o[l.length - 2 - i] = l[i]; o[l.length - 1 - i] = l[i + 1]; } return o; }
        // ---- inks
        tint(ink, t) { return { m: ink, to: "ground", t }; }
        // ---- drawing
        // opt: clip (loops), clipOut (loops), fade [y0, y1] (alpha 0 at y0 .. 1 at y1), grad { a, b, x0, y0, x1, y1 }, edge ("carve"|null|false), alpha
        fill(loops, ink, opt) {
            if (typeof loops[0] === "number") loops = [loops];
            this.ops.push(Object.assign({ loops, ink }, opt));
        }
    }

    // ---- the rasteriser --------------------------------------------------------------------------------------------------------
    class Raster {
        constructor(W, H) {
            this.W = W; this.H = H; this.S = W + 2;

        const box = $("gens");
        for (const g of WP.GEN) {
            const b = document.createElement("button"); b.className = "gen"; b.dataset.gen = g.id; b.dataset.tip = g.blurb;
            const c = document.createElement("canvas"); c.width = 320; c.height = 180;
            const s = document.createElement("span"); s.textContent = g.name;
            b.append(c, s);
            b.onclick = () => { state.gen = g.id; markGen(); buildParams(); schedule(); };
            box.append(b);
        }
    }
    function markGen() { document.querySelectorAll(".gen").forEach(b => b.classList.toggle("on", b.dataset.gen === state.gen)); }
    function buildPal() {
        const box = $("pal"); box.innerHTML = "";
        for (const t of ["Role", "Light", "Dark"]) { const e = document.createElement("div"); e.className = "group"; e.style.margin = "0"; e.textContent = t; box.append(e); }
        for (const r of WP.ROLES) {
            const lab = document.createElement("div"); lab.dataset.tip = r.tip + " Light: " + r.light + ", dark: " + r.dark + ".";
            const star = document.createElement("span"); star.className = "star";
            const mark = () => { lab.textContent = r.label + " "; star.textContent = (state.pal.light[r.id] || state.pal.dark[r.id]) ? "*" : ""; lab.append(star); };
            mark(); box.append(lab);
            for (const m of ["light", "dark"]) {
                const def = WP.defaultHex(m, r.id), cur = state.pal[m][r.id] || def;
                const wrap = document.createElement("div"); wrap.className = "hex"; wrap.dataset.tip = r.tip + " Default " + def + " (" + r[m] + ").";
                const sw = document.createElement("input"); sw.type = "color"; sw.value = cur.toLowerCase();
                const tx = document.createElement("input"); tx.type = "text"; tx.value = cur; tx.maxLength = 7; tx.spellcheck = false;
                const set = (v) => { v = v.toUpperCase(); if (v === def) delete state.pal[m][r.id]; else state.pal[m][r.id] = v; mark(); schedule(); thumbs(); };
                sw.oninput = () => { tx.value = sw.value.toUpperCase(); set(sw.value); };
                tx.oninput = () => { if (/^#[0-9a-fA-F]{6}$/.test(tx.value)) { sw.value = tx.value.toLowerCase(); set(tx.value); } };
                wrap.append(sw, tx); box.append(wrap);
            }
        }
    }
    function buildRes() {
        const sel = $("res"); sel.innerHTML = "";
        for (const [w, h, t] of RES) { const o = document.createElement("option"); o.value = w + "x" + h; o.textContent = t; sel.append(o); }
        const c = document.createElement("option"); c.value = "custom"; c.textContent = "Custom"; sel.append(c);
    }
    function syncRes() {
        const k = state.w + "x" + state.h, sel = $("res");
        sel.value = RES.some(r => r[0] + "x" + r[1] === k) ? k : "custom";
        $("resW").value = state.w; $("resH").value = state.h;
    }
    function syncAll() { $("seed").value = state.seed; markGen(); buildParams(); buildPal(); syncRes(); syncTools(); wearTheme(); thumbs(); schedule(); }
    function syncTools() {
        document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === state.view));
        document.querySelectorAll("#overlays button").forEach(b => b.classList.toggle("on", !!state[b.dataset.over]));
        $("view").classList.toggle("full", state.full);
    }
    function setSeed(v) { state.seed = Math.max(1, Math.min(999999, Math.floor(v) || 1)); $("seed").value = state.seed; schedule(); thumbs(); }

    // ---- export ------------------------------------------------------------------------------------------------------------
    async function download(modes) {
        const btns = [$("dlLight"), $("dlDark"), $("dlBoth")];
        btns.forEach(b => b.disabled = true);
        const W = state.w, H = state.h, st = $("status");
        try {
            const t0 = performance.now();
            for (const m of modes) {
                st.textContent = "Rendering " + m + ", " + W + " x " + H + " ...";
                await new Promise(r => setTimeout(r, 30));
                const scene = WP.build(state.gen, state.seed, state.params[state.gen], W, H, W / H);
                const rgb = WP.renderBytes(scene, palOf(m), W, H, rasterFor(W, H));
                const blob = await WP.encodePng(rgb, W, H, "bauhaus_wallpapers.html#" + serialise());
                const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName(m);
                document.body.append(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 30000);
            }
            st.textContent = modes.join(" + ") + " written in " + ((performance.now() - t0) / 1000).toFixed(1) + " s";
        } catch (e) {
            st.textContent = "Export failed: " + e.message;
        } finally { btns.forEach(b => b.disabled = false); }
    }

    // ---- wiring -------------------------------------------------------------------------------------------------------------
    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
        document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
        document.querySelectorAll(".scroll > .tab").forEach(x => x.classList.toggle("on", x.id === "tab-" + b.dataset.tab));
    });
    document.querySelectorAll("#modes button").forEach(b => b.onclick = () => { state.view = b.dataset.mode; syncTools(); wearTheme(); thumbs(); schedule(); });
    document.querySelectorAll("#overlays button").forEach(b => b.onclick = () => { const k = b.dataset.over; state[k] = !state[k]; if (k === "popup" && state.popup) state.shell = true; if (k === "shell" && !state.shell) state.popup = false; syncTools(); schedule(); });
    $("seed").onchange = () => setSeed(+$("seed").value);
    $("seedPrev").onclick = () => setSeed(state.seed - 1);
    $("seedNext").onclick = () => setSeed(state.seed + 1);
    $("shuffle").onclick = () => setSeed(1 + crypto.getRandomValues(new Uint32Array(1))[0] % 99999);
    $("resetWall").onclick = () => { state.params[state.gen] = {}; buildParams(); schedule(); thumbs(); };
    $("resetPal").onclick = () => { state.pal = { light: {}, dark: {} }; buildPal(); schedule(); thumbs(); };
    $("res").onchange = () => { const v = $("res").value; if (v !== "custom") { const [w, h] = v.split("x").map(Number); state.w = w; state.h = h; syncRes(); schedule(); } };
    for (const id of ["resW", "resH"]) $(id).onchange = () => { state.w = Math.max(16, Math.min(15360, +$("resW").value || 16)); state.h = Math.max(16, Math.min(8640, +$("resH").value || 16)); syncRes(); schedule(); };
    $("dlLight").onclick = () => download(["light"]);
    $("dlDark").onclick = () => download(["dark"]);
    $("dlBoth").onclick = () => download(["light", "dark"]);
    $("copySettings").onclick = () => navigator.clipboard && navigator.clipboard.writeText($("settings").value);
    $("applySettings").onclick = () => { if (parse($("settings").value)) syncAll(); };
    addEventListener("resize", schedule);
    addEventListener("hashchange", () => { if (location.hash.slice(1) !== serialise() && parse(location.hash)) syncAll(); });
    let dragging = false;
    const cutAt = (ev) => { const r = canvas.getBoundingClientRect(); state.cut = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); compose(); };
    canvas.onpointerdown = (ev) => { if (state.view !== "split") return; dragging = true; canvas.setPointerCapture(ev.pointerId); cutAt(ev); };
    canvas.onpointermove = (ev) => { if (dragging) cutAt(ev); };
    canvas.onpointerup = () => { dragging = false; };
    // the tip: one element, placed beside what the pointer rests on
    const tip = $("tip");
    addEventListener("pointerover", (ev) => {
        const el = ev.target.closest && ev.target.closest("[data-tip]");
        if (!el) { tip.classList.remove("on"); return; }
        tip.textContent = el.dataset.tip; tip.classList.add("on");
        const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
        const inPanel = r.left < 380;
        tip.style.left = Math.min(innerWidth - tw - 8, inPanel ? 392 : r.left) + "px";
        tip.style.top = Math.max(8, Math.min(innerHeight - th - 8, inPanel ? r.top : r.bottom + 6)) + "px";
    });
    document.documentElement.addEventListener("pointerleave", () => tip.classList.remove("on"));
    if (location.hash.length > 1) parse(location.hash);
    buildGens(); buildRes();
    syncAll();
})();
</script>
</body>
</html>
