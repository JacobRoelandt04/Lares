# The lock's LAST RESORT: what tools/lockscreen/lares-lock runs when the Quickshell
# lock has failed twice in a row (`hyprlock --grace 0 -c <this file>`).
#
# The user's own hyprlock layout (~/.config/hypr/hyprlock.conf) in the eva
# palette, PINNED here so it does not change under a fallback nobody looks at.
#
# THE ONE LINE THAT MATTERS is `auth { pam { module = lares-lock } }`. Left alone,
# hyprlock authenticates through /etc/pam.d/hyprlock, whose stack (nullok and
# friends) is weaker than the lares-lock service the Lares lock uses. The
# fallback must be no easier to open than the real lock.
$FIELD  = E1E4EB
$BORDER = CED1D7

$BACKGROUND  = EAEDF5
$FOREGROUND = 5D5D5F

$ACCENT = 4480F4
$INCORRECT = EC0000
$CAPS = F0AA0B

auth {
    pam {
        enabled = true
        module = lares-lock
    }
}

background {
    monitor =
    color = rgb($BACKGROUND)
}

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    fade_on_empty = false

    size = 325, 78
    rounding = 32
    outline_thickness = 3
    inner_color = rgb($FIELD)

    outer_color = rgb($BORDER)
    check_color = rgb($ACCENT)
    fail_color = rgb($INCORRECT)
    capslock_color = rgb($CAPS)

    font_color = rgb($FOREGROUND)
    placeholder_text = <i>  </i>
    fail_text = <i> 󰯄 </i>

    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    position = 0, -130
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba($BORDER99)
    shadow_boost = 0.7
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgb($FOREGROUND)
  font_size = 25
  font_family = Audiowide
  position = 0, 430
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgb($FOREGROUND)
  font_size = 110
  font_family = Audiowide
  position = 0, 330
  halign = center
  valign = center
}
